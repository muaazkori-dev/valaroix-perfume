name: Build VALAROIX Mobile Apps (Customer & Admin APKs)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Compile VALAROIX Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 1. BUILD VALAROIX CUSTOMER MOBILE APP
      - name: Install Customer App Dependencies
        working-directory: apps/customer_app
        run: flutter pub get

      - name: Build Customer App Release APK
        working-directory: apps/customer_app
        run: flutter build apk --release --no-tree-shake-icons --verbose

      # 2. BUILD VALAROIX ADMIN OWNER APP
      - name: Install Admin App Dependencies
        working-directory: apps/admin_app
        run: flutter pub get

      - name: Build Admin App Release APK
        working-directory: apps/admin_app
        run: flutter build apk --release --no-tree-shake-icons --verbose

      # 3. PREPARE RELEASE ARTIFACTS
      - name: Package Release Files
        run: |
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk valaroix-customer.apk
          cp apps/admin_app/build/app/outputs/flutter-apk/app-release.apk valaroix-admin.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VALAROIX-Mobile-Apps
          path: |
            valaroix-customer.apk
            valaroix-admin.apk

      - name: Create GitHub Release with Direct APK Download Links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VALAROIX Mobile Apps v1.0.${{ github.run_number }} (Customer & Admin APKs)"
          body: |
            ### 🌟 VALAROIX Haute Parfumerie — Official Mobile Ecosystem Release

            Official Release APK builds for Android devices.

            #### 📱 1. VALAROIX Customer App
            - File: `valaroix-customer.apk`
            - Luxury 3D boutique catalog (`NOIR X`, `VERTEX`, `SAUVAGE`), notes guide, 1-tap cart & checkout, live TCS tracking.
            - Custom Royal French Gold Logo.

            #### 👑 2. VALAROIX Admin Hub App
            - File: `valaroix-admin.apk`
            - Real-time audible order siren & screen alerts, executive revenue desk, 1-click TCS booking, official TCS slip generator, WhatsApp dispatch.
            - Custom Imperial Gold Shield Logo.
            - PIN: `9824`.
          files: |
            valaroix-customer.apk
            valaroix-admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
