name: Build VALAROIX Mobile Apps (Customer & Admin APKs)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Compile VALAROIX Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 1. BUILD VALAROIX CUSTOMER MOBILE APP
      - name: Install Customer App Dependencies
        working-directory: apps/customer_app
        run: flutter pub get

      - name: Build Customer App Release APK
        working-directory: apps/customer_app
        run: flutter build apk --release --no-tree-shake-icons --build-name="1.0.${{ github.run_number }}" --build-number=${{ github.run_number }} --verbose

      # 2. BUILD VALAROIX ADMIN OWNER APP
      - name: Install Admin App Dependencies
        working-directory: apps/admin_app
        run: flutter pub get

      - name: Build Admin App Release APK
        working-directory: apps/admin_app
        run: flutter build apk --release --no-tree-shake-icons --build-name="1.0.${{ github.run_number }}" --build-number=${{ github.run_number }} --verbose

      # 3. PREPARE RELEASE ARTIFACTS
      - name: Package Release Files
        run: |
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk valaroix-customer.apk
          cp apps/admin_app/build/app/outputs/flutter-apk/app-release.apk valaroix-admin.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VALAROIX-Mobile-Apps
          path: |
            valaroix-customer.apk
            valaroix-admin.apk

      - name: Create GitHub Release with Direct APK Download Links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            valaroix-customer.apk \
            valaroix-admin.apk \
            --title "VALAROIX Mobile Apps v1.0.${{ github.run_number }} (Customer & Admin APKs)" \
            --notes "Official Release APK builds for VALAROIX Customer App and Admin Hub."
